name: tuut_app
description: Tuut – einfache, quelloffene Alternative zum klassischen Skype.
publish_to: 'none'
version: 0.5.0+5

environment:
  sdk: '>=3.6.0 <4.0.0'

# "any" = neueste zueinander passende Versionen. Nach dem ersten erfolgreichen
# Build werden die Versionen festgeschrieben, damit sich nichts unbemerkt ändert.
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_vodozemac: any      # Ende-zu-Ende-Verschlüsselung (vodozemac, Rust)
  flutter_webrtc: any         # Sprach-/Videoanrufe
  http: any                   # Verbindung zum Guthaben-Dienst
  matrix: any
  path_provider: any
  sqflite_common_ffi: any
  url_launcher: any           # Stripe-Bezahlseite im Browser öffnen
  webrtc_interface: any

flutter:
  uses-material-design: true
